spring:
  application:
    name: professional-identity-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/professional_identity}
    username: ${DB_USERNAME:professional_identity_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:24h}

admin:
  name: ${ADMIN_NAME:Administrator}
  email: ${ADMIN_EMAIL:admin@professionalidentity.local}
  password: ${ADMIN_PASSWORD}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_SQL:WARN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    hsts-enabled: ${SECURITY_HSTS_ENABLED:false}

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

