spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5433/professional_identity
    username: professional_identity_user
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 24h

admin:
  name: ${ADMIN_NAME:Administrator}
  email: ${ADMIN_EMAIL:admin@professionalidentity.local}
  password: ${ADMIN_PASSWORD}

logging:
  level:
    root: INFO
